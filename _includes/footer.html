<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="wrapper">
    <div class="footer-col-wrapper">
      <div class="footer-col footer-col-1">
        <ul class="contact-list">
          <li class="p-name">{{ site.author }}</li>
          {%- if site.email -%}
            <li><a class="u-email" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
          {%- endif -%}
          {%- if site.portfolio_url -%}
            <li><a href="{{ site.portfolio_url }}" target="_blank" rel="noopener noreferrer">Portfolio</a></li>
          {%- endif -%}
        </ul>
      </div>

      <div class="footer-col footer-col-2">
        <p class="footer-heading-small">Links</p>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.0/css/all.min.css">
        <ul class="social-media-list personal-links">
          {%- for entry in site.minima.social_links -%}
            <li>
              <a rel="me noopener noreferrer" href="{{ entry.url }}" target="_blank" title="{{ entry.title }}">
                <span class="grey fa-brands fa-{{ entry.icon }} fa-fw" aria-hidden="true"></span>
                <span>{{ entry.title }}</span>
              </a>
            </li>
          {%- endfor -%}
        </ul>
      </div>

      <div class="footer-col footer-col-3">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>
  </div>
</footer>
